name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy using docker compose
        run: |
          cd /home/spydomain/skill3/portfolio

          git fetch skill main
          git reset --hard skill/main

          docker compose up -d --build
          docker image prune -f
